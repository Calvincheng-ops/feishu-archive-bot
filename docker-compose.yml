version: "3.8"

services:
  archive-bot:
    build: .
    container_name: feishu-archive-bot
    ports:
      - "8000:8000"
    environment:
      - FEISHU_APP_ID=${FEISHU_APP_ID:-cli_a94a184fb6b91bb4}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET:-1LafPZ5rIrCE7E7HLeFAid8fdVb5jPtf}
      - ENCRYPT_KEY=${ENCRYPT_KEY:-}
      - VERIFICATION_TOKEN=${VERIFICATION_TOKEN:-}
      - BITABLE_APP_TOKEN=${BITABLE_APP_TOKEN:-}
      - BITABLE_TABLE_ID=${BITABLE_TABLE_ID:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

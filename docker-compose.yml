version: "3.8"

services:
  archive-bot:
    build: .
    container_name: feishu-archive-bot
    ports:
      - "8000:8000"
    environment:
      - BOT_APP_ID=${BOT_APP_ID:-}
      - BOT_APP_SECRET=${BOT_APP_SECRET:-}
      - BOT_OPEN_ID=${BOT_OPEN_ID:-}
      - ENCRYPT_KEY=${ENCRYPT_KEY:-}
      - VERIFICATION_TOKEN=${VERIFICATION_TOKEN:-}
      - BITABLE_APP_TOKEN=${BITABLE_APP_TOKEN:-}
      - BITABLE_TABLE_ID=${BITABLE_TABLE_ID:-}
      - ARCHIVE_CHAT_ID=${ARCHIVE_CHAT_ID:-}
      - ARCHIVE_CHAT_NAME=${ARCHIVE_CHAT_NAME:-}
      - ARCHIVE_FOLDER_TOKEN=${ARCHIVE_FOLDER_TOKEN:-}
      - ARCHIVE_FOLDER_NAME=${ARCHIVE_FOLDER_NAME:-归档文件夹}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-20}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
